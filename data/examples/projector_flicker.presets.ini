; Presets for projector_flicker.shader: one [section] per preset, "parameter = value"
; lines setting its sliders. They go with Film Grain's presets of the same
; format (and the same Speed). A cinema's 35mm projector is steady; a 16mm
; school or club projector less so; a Super 8 home projector, with its small
; lamp and lighter film, flickers most. Film from the 1900s was cranked by hand
; at about 16 frames a second, unevenly, and flickers hard (hence "the
; flicks"); by the 1920s cranking was steadier and speeds nearer 20. A worn
; print has dirt and splices: more bumps.

