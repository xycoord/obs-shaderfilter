; Presets for projector_flicker.shader: one [section] per preset, "parameter = value"
; lines setting its sliders. They go with Film Grain's presets of the same
; format (Speed is the frame rate, as in Film Grain). A cinema's 35mm projector
; is steady; a 16mm school or club projector less so; a Super 8 home projector,
; with its small lamp and lighter film, flickers more. Film from the 1900s was
; cranked by hand at about 16 frames a second, unevenly, and flickers hard
; (hence "the flicks"); by the 1920s cranking was steadier and speeds nearer
; 20. A worn print has dirt and splices: more dark frames. Lamp Brightness
; isn't set: lower it for white on black to flicker both ways.

[35mm Cinema]
Exposure_Flicker = 1.5
Lamp_Flicker = 1.0
Dark_Frames = 1
Dark_Frame_Depth = 10
Uneven_Illumination = 0.7
Speed = 24
Hand_Cranking = 0

[16mm]
Exposure_Flicker = 3.5
Lamp_Flicker = 2.5
Dark_Frames = 4
Dark_Frame_Depth = 15
Uneven_Illumination = 1.5
Speed = 24
Hand_Cranking = 0

[Super 8]
Exposure_Flicker = 5
Lamp_Flicker = 4
Dark_Frames = 5
Dark_Frame_Depth = 15
Uneven_Illumination = 2.5
Speed = 18
Hand_Cranking = 0

[Silent Film (1920s)]
Exposure_Flicker = 4
Lamp_Flicker = 3
Dark_Frames = 6
Dark_Frame_Depth = 12
Uneven_Illumination = 2.5
Speed = 18
Hand_Cranking = 6

[Early Cinema (1900s)]
Exposure_Flicker = 8
Lamp_Flicker = 5
Dark_Frames = 12
Dark_Frame_Depth = 25
Uneven_Illumination = 3.5
