; Presets for vhs_tracking.shader: one [section] per preset, "parameter = value"
; lines setting its sliders.
; Named to go together across VHS Signal, VHS Noise, VHS Tracking and VHS
; Tape. Broadcast TV is a clean off-air picture; S-VHS the better tape; Home
; VHS a good tape on a home deck (as the defaults); Long Play the slower,
; noisier speed; Worn Tape one played many times; Bad Tracking a worn tape
; that won't track, with the torn bottom lines and a noise band that a
; TV's overscan and a good deck would hide.

[Broadcast TV]
Standard = 0
Jitter = 0.1
Head_Switching = 0
Tracking_Noise = 0
Skew = 0

[S-VHS]
Standard = 0
Jitter = 0.2
Head_Switching = 0
Tracking_Noise = 0
Skew = 0

[Home VHS]
Standard = 0
Jitter = 0.4
Head_Switching = 0
Tracking_Noise = 0
Skew = 0

[Home VHS (NTSC)]
Standard = 1
Jitter = 0.4
Head_Switching = 0
Tracking_Noise = 0
Skew = 0

[Long Play]
Standard = 0
Jitter = 0.5
Head_Switching = 0
Tracking_Noise = 0
Skew = 0

[Worn Tape]
