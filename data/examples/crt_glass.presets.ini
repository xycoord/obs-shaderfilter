; Presets for crt_glass.shader: one [section] per preset, "parameter = value"
; lines setting its sliders.
; Named to go together across CRT Geometry, CRT Scanlines, CRT Mask, CRT
; Glass and CRT TV. Living Room TV is a family set (slot mask) showing
; broadcast or tape; Trinitron Monitor a flatter, sharper studio monitor
; (aperture grille, as the defaults); Portable TV a small, rounder, less well
; set-up set seen close up, its lines plainly visible; Home Computer and
; Arcade show the fewer, plainly visible lines of games and computers; Tube
; is Living Room TV with the tube's shape leaned into (curvature, round
; corners and falloff), for a full-frame video to read as a TV's picture.

[Living Room TV]
Glow = 1.5
Glow_Size = 4
Corner_Radius = 40
Edge_Falloff = 10

[Trinitron Monitor]
Glow = 1
Glow_Size = 3
Corner_Radius = 25
Edge_Falloff = 6

[Portable TV]
Glow = 2
Glow_Size = 4
Corner_Radius = 70
Edge_Falloff = 20

[Home Computer]
Glow = 2
Glow_Size = 4
Corner_Radius = 40
Edge_Falloff = 10

[Arcade]
Glow = 2
Glow_Size = 5
Corner_Radius = 30
Edge_Falloff = 12

[Tube]
Glow = 1.5
Glow_Size = 4
Corner_Radius = 90
Edge_Falloff = 30
