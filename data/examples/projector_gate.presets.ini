; Presets for projector_gate.shader: one [section] per preset, "parameter =
; value" lines setting its sliders. Named to go with the other film-look
; shaders' presets. A cinema's gate is sharp and nearly square; smaller film's
; is magnified more, so its edge is softer and its corners rounder. Soft is a
; deliberately dreamy edge.

[35mm Cinema]
Corner_Radius = 12
Edge_Softness = 4
Inset = 4

[16mm]
Corner_Radius = 30
Edge_Softness = 8
Inset = 6

[Super 8]
Corner_Radius = 45
Edge_Softness = 10
Inset = 8

[Silent Film (1920s)]
Corner_Radius = 40
Edge_Softness = 10
Inset = 8

[Early Cinema (1900s)]
Corner_Radius = 50
Edge_Softness = 12
Inset = 10

[Soft]
Corner_Radius = 30
Edge_Softness = 22
Inset = 14
