; Presets for video_camera.shader: one [section] per preset, "parameter =
; value" lines setting its sliders. Broadcast Camera is a studio camera, set
; with care; Shot on Video an industrial or ENG camera of the 80s and 90s
; (the defaults), as in instruction tapes and local TV; Camcorder a home
; camera, with heavier outlines and earlier clipping. Shot on Video and
; Camcorder go with VHS Tape's presets of the same name.

[Broadcast Camera]
Detail = 45
Detail_Size = 1.5
Coring = 1.5
Knee = 85
Clip = 98
Saturation = 105

[Shot on Video]
Detail = 80
Detail_Size = 2
Coring = 2
Knee = 80
Clip = 92
Saturation = 115

[Camcorder]
Detail = 130
Detail_Size = 2.2
Coring = 2.5
Knee = 75
Clip = 90
Saturation = 120
