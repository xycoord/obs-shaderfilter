label = Look

[Subtle Film]
description = Barely there: fine grain, a touch of warmth and glow, a gentle rounded frame.
Corner_Falloff = 15

[Projector Only (true colours)]
description = Your colours exactly as they are, shown on an old projector: rounded frame, a little wobble and flicker, lens fringes.
Corner_Falloff = 25

[Vivid Colour]
description = Rich, punchy colour with fine grain and no fading: for colourful graphics.
Corner_Falloff = 25

[Classic Film (16mm)]
description = The all-rounder: visible grain, warm cream whites, a soft glow and a rounded frame.
Corner_Falloff = 25

[Faded Colour]
description = An old colour print whose colours have faded towards pink and warm.
Corner_Falloff = 25

[Dreamy Glow]
description = A soft glow round everything bright, soft focus and a soft-edged frame.
Corner_Falloff = 28

[Home Movie (Super 8)]
description = 1970s home movies: big warm grain, rich colour, dark corners, a lively wobble.
Corner_Falloff = 35

[Worn & Scratched]
description = A print that's been through the projector many times: dust, scratches, dark frames, a jumpier picture.
Corner_Falloff = 25

[Black & White]
description = Clean black and white with fine grain, no wear.
Corner_Falloff = 25

[Silent Film]
description = A 1920s silent film: black and white, dark corners, some dust, a slightly uneven hand-cranked speed.
Corner_Falloff = 40

[Sepia (Old Photo)]
description = Brown-toned like an old photograph, with cream whites.
