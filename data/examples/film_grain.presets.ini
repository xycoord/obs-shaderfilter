; Presets for film_grain.shader: one [section] per preset, "parameter = value"
; lines setting its sliders. Sizes follow the film format: the smaller the
; frame, the larger the same grain is relative to the picture (16mm is about
; 2.4x smaller than 35mm, Super 8 about 4x). Color film's grain sits in three
; dye layers, so it has a little color; sensor noise has more, and is worst
; in the shadows. Pushed film (developed for extra speed) has harsh,
; contrasty grain without color.

