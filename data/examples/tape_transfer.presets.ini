; Presets for tape_transfer.shader: one [section] per preset, "parameter =
; value" lines setting its sliders. Tape Capture is a VHS played into a
; capture card (the defaults); Tape Capture (Source Shape) keeps a wide
; source's shape with the same edges; Clean 4:3 is the 4:3 shape alone.

[Tape Capture]
Aspect = 0
Left_Band = 14
Right_Band = 3
Top_Band = 5
Edge_Softness = 2

[Tape Capture (Source Shape)]
Aspect = 1
Left_Band = 14
Right_Band = 3
Top_Band = 5
Edge_Softness = 2

[Clean 4:3]
Aspect = 0
Left_Band = 0
Right_Band = 0
Top_Band = 0
Edge_Softness = 1.5
