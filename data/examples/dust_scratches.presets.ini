; Presets for dust_scratches.shader: one [section] per preset, "parameter =
; value" lines setting its sliders. Named to go with the other film-look
; shaders' presets, with the same Speed. A cinema's print is cleaned and
; handled carefully; 16mm and Super 8 prints go through many hands and
; projectors, and their dust is magnified more. Old prints are dirtier and
; scratched; a worn print most of all.

[35mm Cinema]
Dust = 1
Speck_Size = 6
Light_Specks = 60
Scratches = 0.1
Speed = 24

[16mm]
