; Presets for dust_scratches.shader: one [section] per preset, "parameter =
; value" lines setting its sliders. Named to go with the other film-look
; shaders' presets, with the same Speed. A cinema's print is cleaned and
; handled carefully; 16mm and Super 8 prints have a little more dirt, faint
; and mostly dark, and it's magnified more. Old prints are dirtier, with the
; light sparkle and scratches of silent film; a worn print most of all.

