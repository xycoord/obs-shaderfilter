; How shaders in this folder appear in the filter's Shader list.
; One line per shader file (name without extension):
;   file = Category | Display name | flags
; The display name is optional (it is made from the file name otherwise).
; Flags, separated by commas:
;   space       draws outside the image (glows, shadows, shake): its filter offers
;               "Add Space Around the Image" next to its settings
;   medium, heavy, very heavy
;               rough GPU cost compared with a simple color filter (3-10x,
;               10-50x, 50x or more), shown in the Shader list. Measured with
;               tests/shadertest.py bench --suite each.
; Put a file like this next to your own shaders to sort them too.

