; Presets for halation.shader: one [section] per preset, "parameter = value"
; lines setting its sliders. Named to go with Film Grain's and Projector
; Flicker's presets. The film base is about as thick on every gauge, so the
; halo is about the same size on the film and bigger in the picture the smaller
; the frame: about 15 pixels on 35mm, 30 on 16mm, 55 on Super 8. Silent film and
; early cinema were black and white, with weaker anti-halation layers, so their
; halos are neutral and stronger.

[35mm]
Strength = 25
Size = 15
Threshold = 70
Film = 0

[16mm]
Strength = 35
Size = 30
Threshold = 70
Film = 0

[Super 8]
Strength = 40
Size = 55
Threshold = 65
Film = 0

[Silent Film (1920s)]
Strength = 45
Size = 18
Threshold = 65
Film = 1

[Early Cinema (1900s)]
Strength = 60
Size = 22
Threshold = 60
Film = 1
