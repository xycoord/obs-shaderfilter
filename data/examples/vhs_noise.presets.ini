; Presets for vhs_noise.shader: one [section] per preset, "parameter = value"
; lines setting its sliders.
; Named to go together across VHS Signal, VHS Noise, VHS Tracking and VHS
; Tape. Broadcast TV is a clean off-air picture; S-VHS the better tape; Home
; VHS a good tape on a home deck (as the defaults); Long Play the slower,
; noisier speed; Worn Tape one played many times; Bad Tracking a worn tape
; that won't track, with the torn bottom lines and a noise band that a
; TV's overscan and a good deck would hide.

[Broadcast TV]
Standard = 0
Noise = 0.3
Colour_Noise = 0.5
Dropouts = 0

[S-VHS]
Standard = 0
Noise = 0.6
Colour_Noise = 1.2
Dropouts = 6

[Home VHS]
Standard = 0
Noise = 1.3
Colour_Noise = 2
Dropouts = 12

[Home VHS (NTSC)]
Standard = 1
Noise = 1.3
Colour_Noise = 2
Dropouts = 12

[Long Play]
Standard = 0
Noise = 2
Colour_Noise = 4
Dropouts = 30

[Worn Tape]
Standard = 0
Noise = 3.5
Colour_Noise = 4
Dropouts = 200

[Bad Tracking]
Standard = 0
Noise = 3
Colour_Noise = 6
Dropouts = 200
