; Presets for lens_chromatic_aberration.shader: one [section] per preset,
; "parameter = value" lines setting its sliders. Named to go with Film Grain's
; and Projector Flicker's presets. The smaller the film, the more the
; projector's lens magnifies it, fringes included; older lenses were less well
; corrected.

[35mm Cinema]
Fringing = 0.5

[16mm]
Fringing = 1.2

[Super 8]
Fringing = 2

[Silent Film (1920s)]
Fringing = 2

[Early Cinema (1900s)]
Fringing = 3
