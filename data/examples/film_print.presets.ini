; Presets for film_print.shader: one [section] per preset, "parameter = value"
; lines setting its sliders. Named to go with the other film-look shaders'
; presets. A cinema's print is fresh and its xenon or arc lamp near white;
; 16mm and Super 8 prints are often older, and their projectors' tungsten
; lamps warm. Silent films were black and white, often toned sepia or tinted
; all over: amber for daylight and interiors, blue for night. Black Lift is
; left at 0: it would show the edge of the picture on a projector.

