; Presets for lens_softness.shader: one [section] per preset, "parameter = value"
; lines setting its sliders. Named to go with the other film-look shaders'
; presets. Smaller film resolves less, and its picture is magnified more on the
; screen: 35mm is nearly sharp at 1080 lines, 16mm about a pixel soft, Super 8
; and old film more, with old lenses softer in the corners.

[35mm Cinema]
Softness = 0.5
Edge_Softness = 0.5

[16mm]
Softness = 1
Edge_Softness = 1

[Super 8]
Softness = 1.5
Edge_Softness = 1.5

[Silent Film (1920s)]
Softness = 1.3
Edge_Softness = 1.5

[Early Cinema (1900s)]
Softness = 1.8
Edge_Softness = 2
