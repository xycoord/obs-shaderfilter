[package]
name = "gigdenoise_gpu"
version = "0.1.0"
edition = "2021"

[lib]
name = "gigdenoise_gpu"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
